site_name: PongDu
site_description: 퐁듀 - Project Zomboid B41 치지직 후원연동 시스템 공식 문서
site_url: https://project-pongdu.github.io/Wiki/

theme:
  name: material
  language: ko

  logo: assets/images/pongdu.ico
  favicon: assets/images/pongdu.ico

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant

    - search.highlight
    - search.suggest
    - search.share

    - content.code.copy
    - content.code.annotate

    - toc.follow
    - navigation.indexes
    - navigation.footer

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 다크 모드

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html

  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 홈: index.md

  - 시작하기:
      - 시스템 요구사항: getting-started/requirements.md
      - 설치: getting-started/installation.md
      - 최초 실행: getting-started/first-run.md

  - 퐁듀 런처:
      - 개요: pongdu-launcher/overview.md
      - 채널 연동: pongdu-launcher/channel.md
      - rewards.txt 경로: pongdu-launcher/rewards-path.md
      - 리워드 티어: pongdu-launcher/reward-tiers.md
      - PZ 원클릭 최적화: pongdu-launcher/pz-optimization.md
      - 문제 해결: pongdu-launcher/troubleshooting.md

  - 퐁듀 모드:
      - 개요: mod-features/overview.md
      - 개인 후원:
          - 버프 룰렛: mod-features/buff-roulette.md
          - 디버프 룰렛: mod-features/debuff-roulette.md
          - 랜덤 무기: mod-features/random-weapon.md
          - 좀비 룰렛: mod-features/zombie-roulette.md
          - 백신: mod-features/vaccine.md
          - 차량 공중보급: mod-features/vehicle-drop.md
          - 뛰좀 소환: mod-features/sprinter5.md
          - 랜덤 텔레포트: mod-features/random-teleport.md
          - 강화 혈청: mod-features/random-skill-potion.md
          - 특수좀비 소환: mod-features/mutant-spawn.md
          - 인벤토리 세이브 티켓: mod-features/inv-save-ticket.md
          - 화력지원 룰렛: mod-features/fire-support.md
          - 미사일 폭격: mod-features/missile.md
          - 좀비 레인: mod-features/zombie-rain.md
          - 강령술: mod-features/rise-up-dead-man.md
      - 서버 후원:
          - 의약품 랜덤박스: mod-features/medical-box.md
          - 호드나이트: mod-features/horde-night.md
      - 기타:
          - 암살자 파견: mod-features/bandit.md

  - FAQ:
      - 자주 묻는 질문: faq/faq.md
      - 알려진 문제: faq/known-issues.md

  - 변경 내역:
      - 릴리즈 노트: changelog/index.md

extra_css:
  - assets/extra.css
